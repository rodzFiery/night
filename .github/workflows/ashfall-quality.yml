name: ASHFALL Quality Gate

on:
  push:
    branches: [main]
    paths:
      - 'app/ashfall_world.html'
      - 'app/static/ashfall-*'
      - 'app/ashfall_economy.py'
      - 'app/ashfall_settlement_achievements.py'
      - 'app/nexora_universal_chronicle.py'
      - 'app/nexora_achievement_providers.py'
      - 'app/nexora_achievement_discovery.py'
      - 'app/nexora_collection_mastery.py'
      - 'app/templates/profile.html'
      - 'app/static/css/profile.css'
      - 'app/ashfall_alliance_technology.py'
      - 'app/ashfall_crystal_age.py'
      - 'app/ashfall_tutorial.py'
      - 'tests/check_ashfall_doctrine.py'
      - 'tests/check_ashfall_doctrine_db.py'
      - 'tests/check_ashfall.py'
      - 'tests/check_ashfall_economic_integrity.py'
      - 'tests/check_ashfall_settlement_achievements.py'
      - 'tests/check_nexora_universal_chronicle.py'
      - 'tests/check_nexora_achievement_providers.py'
      - 'tests/check_nexora_achievement_discovery.py'
      - 'tests/check_nexora_collection_mastery.py'
      - 'tests/check_ashfall_planner.js'
      - 'tests/browser_ashfall.py'
      - 'tests/browser_ashfall_page.py'
      - '.github/workflows/ashfall-quality.yml'
  pull_request:
    paths:
      - 'app/ashfall_economy.py'
      - 'tests/check_ashfall_doctrine.py'
      - 'tests/check_ashfall_doctrine_db.py'
      - 'app/ashfall_alliance_technology.py'
      - 'app/ashfall_crystal_age.py'
      - 'app/ashfall_tutorial.py'
      - 'app/ashfall_world.html'
      - 'app/static/ashfall-*'
      - 'tests/check_ashfall.py'
      - 'tests/browser_ashfall.py'
      - 'tests/browser_ashfall_page.py'
      - '.github/workflows/ashfall-quality.yml'
  workflow_dispatch:

jobs:
  static-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend test dependencies
        run: python -m pip install -r requirements.txt
      - name: Check ASHFALL HTML, assets, and JavaScript syntax
        run: python tests/check_ashfall.py
      - name: Check planner arithmetic and forecast contracts
        run: node tests/check_ashfall_planner.js
      - name: Check economic doctrine rules
        run: python tests/check_ashfall_doctrine.py
      - name: Check doctrine persistence against isolated SQLite database
        run: python tests/check_ashfall_doctrine_db.py
      - name: Check collection mastery thresholds
        run: python tests/check_nexora_collection_mastery.py
      - name: Check achievement discovery catalog
        run: python tests/check_nexora_achievement_discovery.py
      - name: Check universal achievement provider contract
        run: python tests/check_nexora_achievement_providers.py
      - name: Check universal NEXORA Chronicle
        run: python tests/check_nexora_universal_chronicle.py
      - name: Check permanent settlement achievements
        run: python tests/check_ashfall_settlement_achievements.py
      - name: Check economic integrity invariants
        run: python tests/check_ashfall_economic_integrity.py
      - name: Install Chromium browser test dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Exercise architectural previews and construction milestones in Chromium
        run: python tests/browser_ashfall.py
      - name: Exercise full settlement command center at desktop and mobile sizes
        run: python tests/browser_ashfall_page.py
      - name: Preserve desktop and mobile visual diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ashfall-visual-diagnostics
          path: artifacts/ashfall-diagnostics/
          if-no-files-found: warn
          retention-days: 14

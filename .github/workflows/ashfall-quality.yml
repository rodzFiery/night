name: ASHFALL Quality Gate

on:
  push:
    branches: [main]
    paths:
      - 'app/ashfall_world.html'
      - 'app/static/ashfall-*'
      - 'tests/check_ashfall.py'
      - 'tests/browser_ashfall.py'
      - 'tests/browser_ashfall_page.py'
      - '.github/workflows/ashfall-quality.yml'
  pull_request:
    paths:
      - 'app/ashfall_world.html'
      - 'app/static/ashfall-*'
      - 'tests/check_ashfall.py'
      - 'tests/browser_ashfall.py'
      - 'tests/browser_ashfall_page.py'
      - '.github/workflows/ashfall-quality.yml'
  workflow_dispatch:

jobs:
  static-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check ASHFALL HTML, assets, and JavaScript syntax
        run: python tests/check_ashfall.py
      - name: Install Chromium browser test dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Exercise architectural previews and construction milestones in Chromium
        run: python tests/browser_ashfall.py
      - name: Exercise full settlement command center at desktop and mobile sizes
        run: python tests/browser_ashfall_page.py
      - name: Preserve desktop and mobile visual diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ashfall-visual-diagnostics
          path: artifacts/ashfall-diagnostics/
          if-no-files-found: warn
          retention-days: 14
